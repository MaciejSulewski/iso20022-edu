message: pacs.008.001.14
byPath:
  GrpHdr:
    explanation:
      en: "The header block at the top of the message. It holds information that applies to the whole message rather than to one payment: who sent it, when, how many payments it carries and how the banks will settle them. It can also name the sending and receiving banks; this sample does not."
  GrpHdr/MsgId:
    explanation:
      en: "The reference the sending bank gives to this message, so that the receiving bank can quote it when asking about or answering this message. It is a reference between two neighbouring parties: each bank that passes the payment on gives its own message a new reference. It identifies the message, not the payment inside it."
    notes:
      en: Do not confuse it with the end-to-end identification, which follows the payment, not the message.
    examples:
      - MSG-2026-0001
      - MSG-2026-0042
  GrpHdr/CreDtTm:
    explanation:
      en: The moment the sending bank created the message, as a date and a time. It records when the message was made. It does not say when the money moves; that is the interbank settlement date.
    examples:
      - "2026-11-21T09:30:00Z"
      - "2026-11-23T10:15:00Z"
  GrpHdr/NbOfTxs:
    explanation:
      en: How many individual payments the message contains. The receiving bank can compare it with the payment blocks it actually received. This sample carries one.
    examples:
      - "1"
  GrpHdr/SttlmInf:
    explanation:
      en: The block that says how the sending and receiving bank will settle the payments between themselves. Settlement means the actual transfer of funds between the two banks, as opposed to the instruction to do it.
  GrpHdr/SttlmInf/SttlmMtd:
    explanation:
      en: "The way the two banks settle the payments in this message. Each code names who settles or through what: the instructed bank, the instructing bank, a cover payment (a separate bank-to-bank payment that moves the funds alongside this message) or a clearing system."
    notes:
      en: With INDA, the bank that receives the instruction (the instructed agent) does the settling. Both samples use it. The other codes are INGA (the sending bank settles), COVE and CLRG.
    examples:
      - INDA
  CdtTrfTxInf:
    explanation:
      en: "One block per individual credit transfer: a payment that moves money from a debtor (the payer) to a creditor (the payee). It carries everything specific to that payment: references, amount, date, the parties, their accounts and their banks. The message can repeat this block for many payments."
  CdtTrfTxInf/PmtId:
    explanation:
      en: The block that groups the identifiers of one payment. Different parties use different references for the same payment, so the message can carry several side by side.
  CdtTrfTxInf/PmtId/InstrId:
    explanation:
      en: A reference the instructing agent (the bank sending this message) assigns to this one instruction, for use between it and the bank it instructs. They can use it to refer to the instruction in later messages. It is optional.
    examples:
      - INSTR-0001
      - INSTR-0042
  CdtTrfTxInf/PmtId/EndToEndId:
    explanation:
      en: A reference set by the party that started the payment and passed on unchanged through the whole chain of banks. It lets the parties match this payment to their own records for reconciliation. It is mandatory.
    examples:
      - E2E-0001
      - E2E-INV-0457
  CdtTrfTxInf/PmtId/UETR:
    explanation:
      en: A universally unique identifier (a UUID, version 4) that references the payment from start to end. A version 4 UUID is generated at random, so two payments practically never get the same value even without a central numbering scheme, and every bank in the chain can use the same value to find the payment. It is optional.
    examples:
      - 8a562c67-ca16-48ba-b074-65581be6f011
      - 3f1d7c52-9b8e-4a6d-8c4f-2e7a15d0b9c3
  CdtTrfTxInf/IntrBkSttlmAmt:
    explanation:
      en: The money that passes from the instructing agent (the bank sending this message) to the instructed agent (the bank receiving it) for this payment. The Ccy attribute gives the currency as a three-letter ISO 4217 code, for example EUR or USD, and the element's value is the amount in that currency.
    notes:
      en: This is the amount between the banks, not necessarily the amount the debtor originally ordered.
    examples:
      - Ccy="EUR", value 1000.00
      - Ccy="USD", value 2450.50
  CdtTrfTxInf/IntrBkSttlmDt:
    explanation:
      en: "The day the two banks settle: the money leaves the paying bank's balance and reaches the receiving bank's. It is optional."
    notes:
      en: It is not the creation date-time. The message is created at one moment (CreDtTm) and settlement can fall on the same day or a later one. In the first sample, creation is on 2026-11-21 and settlement on 2026-11-23.
    examples:
      - "2026-11-23"
      - "2026-11-24"
  CdtTrfTxInf/ChrgBr:
    explanation:
      en: "Says who pays the fees for processing the payment. SHAR (shared) means the debtor pays the fees on the sending side and the creditor pays those on the receiving side. The other codes put all fees on the debtor (DEBT), all on the creditor (CRED), or follow the rules agreed for the service level or payment scheme in use (SLEV)."
    examples:
      - SHAR
      - DEBT
  CdtTrfTxInf/InstgAgt/FinInstnId:
    explanation:
      en: The block that identifies the instructing bank. It has the same shape as for the other banks in the payment. This sample uses only a BIC.
  CdtTrfTxInf/InstgAgt/FinInstnId/BICFI:
    explanation:
      en: The BIC (ISO 9362) of the bank that sends this message. In this sample it is the same bank as the debtor's agent. The sample's BIC is fictional.
    examples:
      - TESTGB2LXXX
  CdtTrfTxInf/InstdAgt/FinInstnId:
    explanation:
      en: The block that identifies the instructed bank. It has the same shape as for the other banks in the payment. This sample uses only a BIC.
  CdtTrfTxInf/InstdAgt/FinInstnId/BICFI:
    explanation:
      en: The BIC (ISO 9362) of the bank that receives this message. In this sample it is the intermediary agent, so the same BIC also appears in the intermediary agent block. The sample's BIC is fictional.
    examples:
      - TESTUS33XXX
  CdtTrfTxInf/IntrmyAgt1/FinInstnId:
    explanation:
      en: The block that identifies the intermediary bank. It has the same shape as for the other banks in the payment. This sample uses only a BIC.
  CdtTrfTxInf/IntrmyAgt1/FinInstnId/BICFI:
    explanation:
      en: The BIC (ISO 9362) of the intermediary bank that passes the payment from the debtor's bank towards the creditor's bank. The sample's BIC is fictional.
    examples:
      - TESTUS33XXX
  CdtTrfTxInf/Dbtr:
    explanation:
      en: "The debtor: the party that owes the money and whose account is debited. It is the payer. The block identifies the payer, here by name."
  CdtTrfTxInf/Dbtr/Nm:
    explanation:
      en: The payer's name as written in the payment, for example a company's registered name. The banks and the creditor read it to see who is paying. It is optional.
    examples:
      - Example Debtor Ltd
      - Sample Importer Ltd
  CdtTrfTxInf/DbtrAcct:
    explanation:
      en: The debtor's account, the one to be debited because of this payment. The block holds the account identification. It is optional.
  CdtTrfTxInf/DbtrAcct/Id:
    explanation:
      en: The identification of the debtor's account, used by the account owner and the bank that services it. It is either an IBAN or another identifier that the bank assigns (Othr), which can name the scheme it follows. This sample uses an IBAN.
  CdtTrfTxInf/DbtrAcct/Id/IBAN:
    explanation:
      en: The International Bank Account Number of the debtor's account, an account identifier used internationally and defined in the standard ISO 13616. It identifies the account to debit.
    examples:
      - GB82WEST12345698765432
      - GB29NWBK60161331926819
  CdtTrfTxInf/DbtrAgt:
    explanation:
      en: "The debtor's agent: the bank that services the debtor's account, so the bank the payer uses to send the payment. The bank is identified inside the block."
  CdtTrfTxInf/DbtrAgt/FinInstnId:
    explanation:
      en: The block that identifies the debtor's bank. It can hold one or more identifiers (a BIC, a clearing-system member identifier, a legal entity identifier (LEI) or another scheme-specific code) and also the bank's name and address. This sample uses only a BIC.
  CdtTrfTxInf/DbtrAgt/FinInstnId/BICFI:
    explanation:
      en: The BIC (business identifier code, ISO 9362) of the debtor's bank. A BIC is a code allocated to a financial institution to identify it in messages between banks. The sample's BIC is fictional.
    examples:
      - TESTGB2LXXX
  CdtTrfTxInf/CdtrAgt:
    explanation:
      en: "The creditor's agent: the bank that services the creditor's account, so the bank where the money should arrive. The bank is identified inside the block."
  CdtTrfTxInf/CdtrAgt/FinInstnId:
    explanation:
      en: The block that identifies the creditor's bank. It can hold one or more identifiers (a BIC, a clearing-system member identifier, a legal entity identifier (LEI) or another scheme-specific code) and also the bank's name and address. This sample uses only a BIC.
  CdtTrfTxInf/CdtrAgt/FinInstnId/BICFI:
    explanation:
      en: The BIC (business identifier code, ISO 9362) of the creditor's bank. It identifies the institution that services the creditor's account. The sample's BIC is fictional.
    examples:
      - TESTDEFFXXX
  CdtTrfTxInf/Cdtr:
    explanation:
      en: "The creditor: the party the money is due to and whose account is credited. It is the payee. The block identifies the payee, here by name."
  CdtTrfTxInf/Cdtr/Nm:
    explanation:
      en: The payee's name as written in the payment, for example a company's registered name. The banks and the debtor read it to see who is being paid. It is optional.
    examples:
      - Example Creditor GmbH
      - Sample Supplier GmbH
  CdtTrfTxInf/CdtrAcct:
    explanation:
      en: The creditor's account, the one to be credited because of this payment. The block holds the account identification. It is optional.
  CdtTrfTxInf/CdtrAcct/Id:
    explanation:
      en: The identification of the creditor's account, used by the account owner and the bank that services it. It is either an IBAN or another identifier that the bank assigns (Othr), which can name the scheme it follows. This sample uses an IBAN.
  CdtTrfTxInf/CdtrAcct/Id/IBAN:
    explanation:
      en: The International Bank Account Number of the creditor's account, an account identifier used internationally and defined in the standard ISO 13616. It identifies the account to credit.
    examples:
      - DE89370400440532013000
      - DE02120300000000202051
  CdtTrfTxInf/RmtInf:
    explanation:
      en: "The remittance information: details meant for the creditor, so that it can match the incoming money to what the payment is for, such as an invoice. It comes in two forms. Ustrd is free text and Strd is split into fields a computer can read. It is optional."
  CdtTrfTxInf/RmtInf/Strd:
    explanation:
      en: One structured remittance block. Instead of free text it gives separate fields for the documents the payment refers to, a creditor reference, the invoicer and invoicee, tax and other data, so the creditor's system can reconcile the payment automatically. The element can repeat. This sample uses the referred document and the creditor reference.
  CdtTrfTxInf/RmtInf/Strd/RfrdDocInf:
    explanation:
      en: "A document the payment refers to, for example an invoice. It gives the document's type and number and can add a date and the document's lines. It can repeat, one block per document."
  CdtTrfTxInf/RmtInf/Strd/RfrdDocInf/Tp:
    explanation:
      en: The type of the referred document. Its main part is the code or proprietary choice, and it can also name who issued the type.
  CdtTrfTxInf/RmtInf/Strd/RfrdDocInf/Tp/CdOrPrtry:
    explanation:
      en: A choice between two ways to give the document type. Use a code from an external code list (Cd) or a text the parties have agreed between themselves (Prtry), never both.
  CdtTrfTxInf/RmtInf/Strd/RfrdDocInf/Tp/CdOrPrtry/Cd:
    explanation:
      en: The document type as a code from an external list that is kept outside this message's schema. The schema only requires one to four characters, so which codes are valid depends on that list.
    examples:
      - CINV
    notes:
      en: In the external document type list, CINV stands for a commercial invoice.
  CdtTrfTxInf/RmtInf/Strd/RfrdDocInf/Nb:
    explanation:
      en: The number that identifies the referred document, for example an invoice number. The creditor uses it to find the document in its own records.
    examples:
      - INV-2026-0457
  CdtTrfTxInf/RmtInf/Strd/CdtrRefInf:
    explanation:
      en: "A reference the creditor created so that it can recognise what the payment is for. It has a type and the reference itself, and both are optional."
  CdtTrfTxInf/RmtInf/Strd/CdtrRefInf/Tp:
    explanation:
      en: The kind of creditor reference that follows. Its main part is the code or proprietary choice, and it can also name the party that assigns this kind of reference.
  CdtTrfTxInf/RmtInf/Strd/CdtrRefInf/Tp/CdOrPrtry:
    explanation:
      en: A choice between two ways to give the reference type. Use a code from an external code list (Cd) or a text the parties have agreed between themselves (Prtry), never both.
  CdtTrfTxInf/RmtInf/Strd/CdtrRefInf/Tp/CdOrPrtry/Cd:
    explanation:
      en: The reference type as a code from an external list that is kept outside this message's schema. The schema only requires one to four characters, so which codes are valid depends on that list.
    examples:
      - SCOR
    notes:
      en: In the external list, SCOR stands for a structured communication reference given by the creditor.
  CdtTrfTxInf/RmtInf/Strd/CdtrRefInf/Ref:
    explanation:
      en: The reference itself, as the creditor assigned it, up to 35 characters. The creditor can match the incoming payment to the item it belongs to by this value. The value in the sample is a published example creditor reference; it belongs to no party.
    examples:
      - RF18539007547034
byType:
  BranchAndFinancialInstitutionIdentification8:
    explanation:
      en: A block that identifies a bank and, if needed, one of its branches. The bank itself is identified in the FinInstnId part, for example by its BIC. The branch part is only needed when that identification does not already point to a specific branch. The same block is used for every bank in the payment, so the name of the element that holds it tells you which bank it is.
  CashAccount40:
    explanation:
      en: A block that identifies an account. Its main part is the account identifier, either an IBAN or another identifier. It can also give the account type, its currency, a name for the account and a proxy, which is an alternative name for reaching the account. The currency is only needed when one account number covers several currencies. The name of the element that holds the block tells you whose account it is.
  ActiveOrHistoricCurrencyAndAmount:
    explanation:
      en: An amount of money together with its currency. The number is the text of the element and the currency is the Ccy attribute, written as an ISO 4217 currency code. The currency may be one in use today or one that is no longer used. What the amount stands for depends on the element and on the block that holds it.
  ActiveCurrencyAndAmount:
    explanation:
      en: An amount of money together with its currency. The number is the text of the element and the currency is the Ccy attribute, written as an ISO 4217 currency code. Unlike the historic variant, it accepts only currencies that are in use today. What the amount stands for depends on the element and on the block that holds it.
  PartyIdentification272:
    explanation:
      en: A block that identifies a party, which is either a person or an organisation. It can hold the party's name, postal address, identification, country of residence and contact details, and all of them are optional. The same block is used for every party in the payment, so the name of the element that holds it tells you the party's role.
  PostalAddress27:
    explanation:
      en: A block that holds an address in the form postal services use. It offers separate fields, such as street name, building number, post code, town and country, and also free lines of text (AdrLine). All of the fields are optional, so an address can be given in whichever form the sender has. The name of the element that holds it tells you whose address it is.
  PaymentTypeInformation28:
    explanation:
      en: A block with further detail about the type of payment. It can give the priority, the clearing channel, the service level, the local instrument and the category purpose. All are optional, and they tell the banks how the payment should be handled.
  ServiceLevel8Choice:
    explanation:
      en: A choice between two ways to name a service level, which is an agreement or a set of rules that applies to the item the parent element describes (a payment or a mandate). Use either a code taken from an external code list (Cd) or a code the parties have agreed between themselves (Prtry), never both. The codes themselves come from outside this message.
  LocalInstrument2Choice:
    explanation:
      en: A choice between two ways to name a local instrument, an instrument specific to one community of users. It can also refine the service or service level. The parent element says whether it belongs to a payment or a mandate. Use either a code taken from an external code list (Cd) or a code the parties have agreed between themselves (Prtry), never both.
  CategoryPurpose1Choice:
    explanation:
      en: A choice between two ways to give the high-level purpose of the item the parent element describes (a payment or a mandate), in broad categories. Use either a code taken from an external code list (Cd) or a code in a proprietary form (Prtry), never both. For a payment, the initiating party uses it to tell the banks something about how to process it, and it may lead them to handle it in a special way.
  TaxData1:
    explanation:
      en: A block for tax information that goes with the payment. It can name the parties the tax applies to and give the tax reference, the amount the tax is based on, the tax amount itself and a date. It also holds tax records. All of it is optional.
  SupplementaryData1:
    explanation:
      en: A block for extra information that does not fit any of the other fields of the message. It has two parts. PlcAndNm says where in the message the extra data belongs, written as an XPath when the message is XML. Envlp is the envelope that wraps the data itself.
codes:
  SettlementMethod1Code:
    INDA:
      en: The bank that receives the instruction does the settling.
    INGA:
      en: The bank that sends the instruction does the settling, then passes the payment on to the next bank.
    COVE:
      en: The banks settle with a separate cover payment instead of through this message.
    CLRG:
      en: The banks settle through a payment clearing system.
  ChargeBearerType1Code:
    DEBT:
      en: The debtor pays all the fees for this payment.
    CRED:
      en: The creditor pays all the fees for this payment.
    SHAR:
      en: The two sides split the fees. The debtor pays the fees on the sending side and the creditor pays the fees on the receiving side.
    SLEV:
      en: The fees follow the rules of the service level or scheme the payment uses.
  Priority2Code:
    HIGH:
      en: The payment should be handled with high priority.
    NORM:
      en: The payment should be handled with normal priority.
  Priority3Code:
    URGT:
      en: The payment is urgent, the highest priority there is.
    HIGH:
      en: The payment should be handled with high priority.
    NORM:
      en: The payment should be handled with normal priority.
  ClearingChannel2Code:
    RTGS:
      en: The payment goes through a real-time gross settlement system.
    RTNS:
      en: The payment goes through a real-time net settlement system.
    MPNS:
      en: The payment goes through a net settlement system for mass payments.
    BOOK:
      en: The payment is made as an internal book transfer.
  CreditDebitCode:
    CRDT:
      en: "A credit: the adjustment adds to the amount it applies to."
    DBIT:
      en: "A debit: the adjustment is subtracted from the amount it applies to."
